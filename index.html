<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>SPE Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a one-screen clinic app. Hallway of doors → exam room (scene left, console right) → hallway desk for the SOAP note → debrief. */
:root{
  --bg:#eef3f4; --surface:#ffffff; --surface2:#e2ebed; --ink:#142129; --ink2:#4b5c66; --line:#c9d6da;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d7eeeb;
  --warn:#b45309; --warn-soft:#fdebd0; --crit:#b91c1c; --crit-soft:#fde2e2; --ok:#15803d; --ok-soft:#dcf2e3;
  --wall:#dfe9ea; --floor:#c9b89a; --gown:#9ec5d8; --skin:#e6b797; --skinpale:#f1d9c6;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:10px; --shadow:0 6px 24px rgba(20,33,41,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f181c; --surface:#17242a; --surface2:#1f3038; --ink:#e7eef0; --ink2:#9fb3bb; --line:#2c414a;
  --accent:#3fbfb2; --accent-ink:#06211e; --accent-soft:#163b38;
  --warn:#f5a04a; --warn-soft:#3b2a12; --crit:#f07171; --crit-soft:#3d1a1a; --ok:#5fd08a; --ok-soft:#153323;
  --wall:#203239; --floor:#4d4435; --gown:#5e8aa0; --skin:#c99a7a; --skinpale:#d9b9a2; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f181c; --surface:#17242a; --surface2:#1f3038; --ink:#e7eef0; --ink2:#9fb3bb; --line:#2c414a;
  --accent:#3fbfb2; --accent-ink:#06211e; --accent-soft:#163b38;
  --warn:#f5a04a; --warn-soft:#3b2a12; --crit:#f07171; --crit-soft:#3d1a1a; --ok:#5fd08a; --ok-soft:#153323;
  --wall:#203239; --floor:#4d4435; --gown:#5e8aa0; --skin:#c99a7a; --skinpale:#d9b9a2; --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.8rem;font-weight:700} h2{font-size:1.25rem;font-weight:700} h3{font-size:1rem;font-weight:700}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.muted{color:var(--ink2)}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .brand{display:flex;align-items:baseline;gap:10px}
.topbar .brand h1{font-size:1.15rem}
.topbar .spacer{flex:1}
.timer{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.25rem;font-weight:500;padding:4px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.timer.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.timer.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.phase{flex:1;min-height:0;overflow:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;min-height:28px;font-size:.8rem}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.78rem;cursor:pointer;line-height:1.2}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.neutral{background:var(--surface2);color:var(--ink2)}
.pill.new{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical}
label.lbl{display:block;font-size:.75rem;font-weight:600;color:var(--ink2);margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}

/* ---------- Hallway ---------- */
.hall{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hall-intro{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media (max-width:760px){.hall-intro{grid-template-columns:1fr}}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.door{position:relative;border:none;background:transparent;padding:0;text-align:left}
.door .frame{background:linear-gradient(180deg,#8a6a4a,#6e5238);border-radius:8px 8px 2px 2px;padding:8px;box-shadow:var(--shadow);transition:transform .15s}
.door:hover .frame{transform:translateY(-3px)}
.door .panel{background:linear-gradient(180deg,#b08a63,#9a7452);border-radius:6px 6px 2px 2px;height:150px;position:relative;border:2px solid rgba(0,0,0,.15)}
.door .panel .window{position:absolute;left:18%;right:18%;top:12px;height:46px;background:rgba(220,235,240,.8);border-radius:3px;border:2px solid rgba(0,0,0,.2)}
.door .panel .knob{position:absolute;right:12px;top:78px;width:10px;height:10px;border-radius:50%;background:#e8d27a;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.door .plate{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#f4efe3;color:#2b241c;font-family:var(--font-mono);font-size:.75rem;padding:3px 8px;border-radius:3px;border:1px solid #b5a98c;white-space:nowrap}
.door .note{position:absolute;left:12px;bottom:10px;background:#fff8c2;color:#2b241c;font-family:var(--font-mono);font-size:.62rem;line-height:1.3;padding:5px 7px;transform:rotate(-2deg);box-shadow:1px 2px 4px rgba(0,0,0,.25);max-width:80%}
.door .status{margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.door.done .panel{filter:saturate(.6) brightness(.9)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings .row{display:flex;flex-direction:column;gap:4px}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem}
.toggle input{width:auto}

/* ---------- Door note modal / overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay .sheet{background:var(--surface);border-radius:14px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.doornote{background:#fff8c2;color:#2b241c;font-family:var(--font-mono);font-size:.85rem;padding:14px 16px;border-radius:4px;box-shadow:2px 3px 8px rgba(0,0,0,.25);transform:rotate(-.5deg);white-space:pre-wrap}

/* ---------- Exam room ---------- */
.room{display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(320px,1fr);gap:14px;height:100%;min-height:0}
@media (max-width:860px){.room{grid-template-columns:1fr;height:auto}}
.scene{display:flex;flex-direction:column;gap:10px;min-height:0}
.scene-svg{width:100%;height:auto;max-height:52vh;background:var(--wall);border-radius:12px;border:1px solid var(--line);display:block}
@media (max-width:860px){.scene-svg{max-height:none}}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:54px;font-size:.95rem}
.bubble .who{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:2px}
.actions{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px}
.actions .eyebrow{margin-bottom:8px}
.scene-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.scene-actions .btn{min-height:56px;font-size:1rem;font-weight:600;justify-content:flex-start;gap:10px;padding:10px 14px;border-width:2px;border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:0 2px 0 var(--accent)}
.scene-actions .btn:hover{background:var(--accent);color:var(--accent-ink)}
.scene-actions .btn:active{transform:translateY(2px);box-shadow:none}
.scene-actions .btn .ic{font-size:1.4rem;line-height:1}
.scene-actions .btn.leave{border-color:var(--warn);background:var(--warn-soft);box-shadow:0 2px 0 var(--warn)}
.scene-actions .btn.leave:hover{background:var(--warn);color:#fff}
.status-row{display:flex;gap:8px;flex-wrap:wrap;font-size:.75rem}
.console{display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surface2);overflow-x:auto}
.tabs button{flex:1;border:none;background:transparent;padding:10px 8px;font-weight:600;font-size:.82rem;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--surface)}
.tabpane{flex:1;min-height:0;overflow:auto;padding:12px;display:none;flex-direction:column;gap:10px}
.tabpane.active{display:flex}
.chatlog{display:flex;flex-direction:column;gap:8px;flex:1;min-height:160px;max-height:40vh;overflow:auto;padding:4px}
@media (max-width:860px){.chatlog{max-height:30vh}}
.msg{max-width:88%;padding:8px 11px;border-radius:12px;font-size:.9rem;line-height:1.4;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:3px}
.msg.pt{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:3px}
.msg.sys{align-self:center;background:transparent;color:var(--ink2);font-size:.78rem;font-style:italic;text-align:center}
.msg.find{align-self:stretch;background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:6px;font-family:var(--font-mono);font-size:.8rem}
.composer{display:flex;gap:8px}
.composer input{flex:1}
.chipgroups{display:flex;flex-direction:column;gap:6px}
.chipgroup summary{cursor:pointer;font-size:.78rem;font-weight:600;color:var(--ink2);padding:4px 0}
.chipgroup .chips{display:flex;flex-wrap:wrap;gap:5px;padding:4px 0 6px}
.examlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.exambtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left}
.exambtn:hover{border-color:var(--accent)}
.exambtn .t{font-weight:600;font-size:.85rem}
.exambtn .s{font-size:.72rem;color:var(--ink2)}
.exambtn.done{border-color:var(--ok);background:var(--ok-soft)}
.exambtn.partial{border-color:var(--warn)}
.findings{display:flex;flex-direction:column;gap:6px}
.finding{background:var(--warn-soft);border-left:3px solid var(--warn);padding:6px 10px;border-radius:6px;font-size:.82rem}
.finding b{font-family:var(--font-mono);font-size:.75rem}
.clip{flex:1;min-height:200px;font-family:var(--font-mono);font-size:.85rem;background:#fffdf3;color:#2b241c;background-image:repeating-linear-gradient(transparent,transparent 21px,#e5dcb8 21px,#e5dcb8 22px);line-height:22px;padding:6px 10px}
:root[data-theme="dark"] .clip{background:#2b2a22;color:#efe9d2;background-image:repeating-linear-gradient(transparent,transparent 21px,#4a4733 21px,#4a4733 22px)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .clip{background:#2b2a22;color:#efe9d2;background-image:repeating-linear-gradient(transparent,transparent 21px,#4a4733 21px,#4a4733 22px)} }

/* ---------- Mini-game (body maps) ---------- */
.minigame{display:flex;flex-direction:column;gap:8px}
.mg-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mg-tools .tool{padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.8rem}
.mg-tools .tool.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mg-svg{width:100%;max-width:420px;margin:0 auto;display:block;background:var(--surface2);border-radius:12px;border:1px solid var(--line);touch-action:manipulation}
.mg-svg .hit{cursor:crosshair}
.mg-svg .target{fill:none;stroke:none}
.mg-svg .target.show{stroke:var(--accent);stroke-dasharray:3 3;fill:var(--accent-soft);fill-opacity:.5}
.mg-svg .mark{fill:var(--accent);stroke:#fff;stroke-width:1.5}
.mg-svg .mark.hand{fill:var(--warn)}
.mg-svg text{font-family:var(--font-mono);font-size:9px;fill:var(--ink2)}
.mg-progress{display:flex;flex-wrap:wrap;gap:5px}
.mg-progress .p{font-size:.7rem;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--ink2);font-family:var(--font-mono)}
.mg-progress .p.hit{background:var(--ok-soft);color:var(--ok)}
.hold{position:relative;overflow:hidden;touch-action:none;user-select:none}
.hold .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent-soft);z-index:0;transition:width .05s linear}
.hold span{position:relative;z-index:1}
.skinopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px}
.orders label{display:flex;gap:6px;align-items:flex-start;font-size:.82rem;padding:3px 0;cursor:pointer}
.orders input{width:auto;margin-top:3px}

/* ---------- SOAP phase ---------- */
.soap{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(320px,1.4fr);gap:14px;height:100%;min-height:0}
@media (max-width:860px){.soap{grid-template-columns:1fr;height:auto}}
.soap .left{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.soap .note{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.soap .note textarea{font-family:var(--font-mono);font-size:.82rem}
.note-sec{display:flex;flex-direction:column;gap:4px}
.note-sec .h{display:flex;justify-content:space-between;align-items:baseline}
.note-sec .h small{color:var(--ink2);font-size:.7rem}
.soap-head{font-family:var(--font-display);font-weight:700;font-size:1rem;color:var(--accent);padding-top:6px;border-top:1px solid var(--line)}

/* ---------- Debrief ---------- */
.debrief{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.score .n{font-family:var(--font-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.score .l{font-size:.75rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.meter{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}
.checklist{display:flex;flex-direction:column;gap:4px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;padding:5px 8px;border-radius:6px;background:var(--surface2)}
.ck .m{font-family:var(--font-mono);font-size:.8rem;min-width:22px;text-align:center;font-weight:600}
.ck.ok .m{color:var(--ok)} .ck.miss .m{color:var(--crit)} .ck.part .m{color:var(--warn)}
.ck small{display:block;color:var(--ink2)}
details.reveal summary{cursor:pointer;font-weight:600}
.scriptblock{font-family:var(--font-mono);font-size:.78rem;white-space:pre-wrap;background:var(--surface2);padding:10px;border-radius:8px;max-height:400px;overflow:auto}
.evidence{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:.85rem}
.ev .dot{width:14px;height:14px;border-radius:50%;margin-top:3px}
.ev .dot.found{background:var(--ok)} .ev .dot.missed{background:var(--crit)}
.rubric{display:flex;flex-direction:column;gap:6px}
.rb{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:8px 10px;border-radius:8px;background:var(--surface2);font-size:.85rem}
.rb .pts{font-family:var(--font-mono);font-weight:600;white-space:nowrap}
.rb small{display:block;color:var(--ink2)}
.rb.full{border-left:3px solid var(--ok)} .rb.part{border-left:3px solid var(--warn)} .rb.none{border-left:3px solid var(--crit)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.flash{animation:flash .6s}
@keyframes flash{0%{background:var(--warn-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <div class="topbar">
    <div class="brand"><h1>SPE Simulator</h1><span class="muted" id="phaseLabel">Hallway</span></div>
    <span id="roomLabel" class="mono muted"></span>
    <div class="spacer"></div>
    <span id="timer" class="timer" hidden>18:00</span>
    <button class="btn small ghost" id="btnClip" hidden>Clipboard</button>
    <button class="btn small ghost" id="btnQuit" hidden>Leave simulation</button>
  </div>
  <div class="phase" id="phase"></div>
</div>
<div id="overlayHost"></div>
<script>
// ===================== PATIENT SCRIPTS =====================
// Each case is a standardized-patient script. Answers are keyed by intent id.
// Anything not listed falls back to DEFAULTS (a normal/negative answer).
const DEFAULTS = {
  intro: "Hi, nice to meet you.",
  consent: "Yes, that's fine.",
  other_concerns: "No, that's really the main thing.",
  agenda: "Okay, that sounds fine.",
  prior_episodes: "No, nothing like this before.",
  injuries: "No serious injuries that I can think of.",
  hosp: "I've never been hospitalized.",
  psh: "No surgeries.",
  meds_otc: "I don't take anything over the counter, not regularly.",
  meds_supp: "No vitamins or supplements.",
  all_med: "No medication allergies that I know of.",
  all_food: "No food allergies.",
  all_env: "No seasonal or environmental allergies.",
  drugs: "No, I don't use any drugs.",
  diet: "Pretty average, I guess.",
  exercise: "Not as much as I should.",
  sexual: "I'd rather not get into that unless it matters for this.",
  living: "I live at home, nothing unusual.",
  fh_extended: "Nobody else in the family that I know of.",
  fh_children: "No kids.",
  ros_fever: "No fever.", ros_chills: "No chills.", ros_nightsweats: "No night sweats.",
  ros_weight: "My weight's been about the same.", ros_fatigue: "I'm a bit more tired than usual, but nothing dramatic.",
  ros_chestpain: "No chest pain.", ros_palpitations: "No, I haven't noticed my heart racing or skipping.",
  ros_orthopnea: "No, I sleep flat on one pillow just fine.", ros_pnd: "No, I don't wake up gasping or anything.",
  ros_edema: "No swelling in my legs or feet.", ros_syncope: "I haven't fainted or passed out.",

let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch { voices = []; } }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, c) {
  if (!settings.voice || !("speechSynthesis" in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g, "").replace(/\.\.\./g, ","));
    const en = voices.filter(v => /^en/i.test(v.lang));
    const want = c.voice === "female" ? /female|samantha|victoria|karen|moira|tessa|fiona|zira|susan|allison|ava|serena|kate|anna|emma/i : /male|daniel|alex|fred|david|mark|james|tom|lee|rishi|aaron|arthur|oliver|guy/i;
    let v = en.find(x => want.test(x.name)) || en.find(x => c.voice === "female" ? !/male|daniel|alex|fred|david|mark|james|tom/i.test(x.name) : true) || en[0];
    if (v) u.voice = v;
    u.rate = c.look.distress >= 3 ? .82 : c.look.distress === 2 ? .9 : .98; u.pitch = c.voice === "female" ? 1.1 : .9;
    mic.mute(true); u.onend = () => mic.mute(false); u.onerror = () => mic.mute(false);
    speechSynthesis.speak(u);
  } catch { }
}

// ---------- chat ----------
function appendMsg(m, save = true) {
  if (save) S.log.push(m);
  const log = $("#chatlog"); if (!log) return;
  const d = document.createElement("div"); d.className = "msg " + m.who; d.textContent = m.text; log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function sysMsg(t) { appendMsg({ who: "sys", text: t }); }
function findMsg(t) { appendMsg({ who: "find", text: t }); }
function ptSay(t) { appendMsg({ who: "pt", text: t }); const b = $("#bubbleText"); if (b) b.textContent = t; speak(t, caseOf()); }

async function studentSays(text, extra) {
  appendMsg({ who: "me", text });
  const c = caseOf();
  const local = matchIntents(text);
  if (extra) extra.forEach(i => { if (!local.intents.includes(i)) local.intents.push(i); });
  if (local.intents.includes("ap_explain")) { S.apDiscussed = true; S.apText.push(text); }
  local.intents.forEach(i => applyIntentEffects(i, text));
  local.reply = buildReply(local.intents);
  local.intents.forEach(i => { if (!S.asked.has(i)) { S.asked.add(i); S.askedOrder.push({ i, t: Date.now() }); } });
  if (/student doctor\s+[a-z'-]{2,}\s+[a-z'-]{2,}/i.test(text) || /\bi'?m\s+(dr\.?|doctor)\s+[a-z'-]{2,}\s+[a-z'-]{2,}/i.test(text)) S.introFullName = true;
  if (local.intents.includes("empathy")) S.empathy++;
  renderStatus(); renderChips();
  const useClaude = sampleFn && (settings.brain === "claude" || (settings.brain === "hybrid" && local.intents.filter(i => !["empathy", "smalltalk", "wash"].includes(i)).length === 0));
  if (useClaude) {
    const bubble = $("#bubbleText"); if (bubble) bubble.textContent = "…";
    try {
      const r = await askClaudePatient(text, local.intents);
      if (r && r.reply) { (r.intents || []).forEach(i => { if (INTENT_IDS.has(i) && !S.asked.has(i)) { S.asked.add(i); S.askedOrder.push({ i, t: Date.now() }); applyIntentEffects(i, text); } }); ptSay(r.reply); renderStatus(); renderChips(); return; }
    } catch (e) { if (e && e.code === "not_granted") { sampleFn = null; sysMsg("Claude isn't allowed for this page, so the patient will answer from the script."); } else if (e && e.code === "rate_limited") { sysMsg("Claude is busy right now; answering from the script."); } }
  }
  ptSay(local.reply || scriptedUnknown(text, c));
}
function scriptedUnknown(text, c) {
  if (/\?$/.test(text.trim()) || /\b(do|did|does|have|has|are|is|any|when|where|what|how|why)\b/i.test(text)) return c.look.distress >= 3 ? "I... don't follow. Sorry." : "I'm not sure what you mean. Could you ask that a different way?";
  return c.look.distress >= 3 ? "Okay." : "Okay.";
}

async function askClaudePatient(text, localIntents) {
  const c = caseOf(); S.claudeCalls++;
  const turns = S.log.filter(m => m.who === "me" || m.who === "pt").slice(-10).map(m => `${m.who === "me" ? "Student doctor" : "Patient"}: ${m.text}`).join("\n");
  const script = Object.assign({}, DEFAULTS, c.a);
  const prompt = `You are a standardized patient in a medical-school clinical skills exam. Stay in character as ${c.name}, a ${c.age}-year-old ${c.sex}. Chief complaint: ${c.door.cc}. Distress level ${c.look.distress}/3 (${c.look.note}).
Rules: answer ONLY what the student asks, briefly (1–3 sentences), in plain conversational language, matching the distress level (short phrases if distressed). Never volunteer a diagnosis, never volunteer information from the script that wasn't asked, never break character. If the student uses jargon, ask what it means. If the question matches a script line, use that line's content (you may reword lightly). If a question is not covered, improvise a consistent, unremarkable answer that does not add new symptoms. Physical-exam findings are read to the student only when they examine, so do not describe exam findings in conversation.
SCRIPT (intent id → answer): ${JSON.stringify(script)}
Recent conversation:
${turns || "(none)"}
Student doctor now says: "${text.replace(/"/g, "'")}"
Reply with ONLY JSON: {"reply": "<what the patient says>", "intents": [<intent ids from the script that this line asked about, possibly empty>]}`;
  return await sampleFn.json(prompt, { modelTier: "quick", cache: false });
}

function applyIntentEffects(i, text) {
  const c = caseOf();
  if (i === "gown_remove") { S.gownAsked = true; if (/help|would you like|untie|do you want me/i.test(text)) S.gownHelpOffered = true; S.gown = "off"; renderStatus(); renderScene(); }
  if (i === "gown_regown") { S.regownOffered = true; S.gown = "on"; renderStatus(); renderScene(); }
  if (i === "hold_breath") S.holdingBreathUntil = Date.now() + 25000;
  if (i === "breathe_mouth") S.mouthBreathing = true;
  if (i === "arm_up") S.armUp = true;
  if (i === "socks_off") { S.socksOff = true; renderScene(); }
  if (i === "wash") sanitize(true);
  if (i === "close") S.closed = true;
  if (i === "teach_back") {
    if (!S.apDiscussed) { S.teachBack = "early"; }
    else { const said = S.apText.join(" "); const must = c.orders.must.map(o => o.id); const got = must.filter(m => S.orders.has(m) || (ORDER_RE[m] && ORDER_RE[m].test(said))).length; S.teachBack = got >= Math.ceil(must.length * .6) ? "ok" : "bad"; }
  }
  if (i === "say_e") { if (Object.keys(S.hits).some(k => /^L_(RLP|RMP|LLP|RUP|LUP|LMP|RLA|LLA|RUA|LUA)$/.test(k))) { S.egophony = true; findMsg("Egophony: " + c.exam.egophony); } else sysMsg("Put the stethoscope on the back over a lung field while the patient says 'E' to test for egophony."); }
}

    <div class="grid2">
      <div class="card"><h3>Evidence chain — what revealed the nasty</h3><p class="muted" style="font-size:.8rem;margin:4px 0 8px">Each clue lists the questions or exams that would have surfaced it. Green = you found it.</p><div class="evidence">${R.nasty.flags.map(f => `<div class="ev"><span class="dot ${f.found ? "found" : "missed"}"></span><div>${esc(f.label)}<br><small class="muted">revealed by: ${f.reveal.map(r => esc(r)).join(", ")}${f.found ? " — you asked/did: " + f.by.join(", ") : ""}</small></div></div>`).join("")}</div>
        <h3 style="margin-top:12px">Your orders</h3><div class="checklist" style="margin-top:6px">${R.nasty.must.map(m => `<div class="ck ${m.got ? "ok" : "miss"}"><span class="m">${m.got ? "✓" : "✗"}</span><div><b>${esc(m.label)}</b> <span class="pill ${m.got ? "ok" : "crit"}">must</span><small>${esc(m.why)}</small></div></div>`).join("")}${R.nasty.good.filter(g => g.got).map(g => `<div class="ck ok"><span class="m">✓</span><div>${esc(g.label)} <span class="pill neutral">reasonable</span><small>${esc(g.why)}</small></div></div>`).join("")}${R.nasty.avoid.filter(a => a.got).map(a => `<div class="ck miss"><span class="m">!</span><div><b>${esc(a.label)}</b> <span class="pill crit">not here</span><small>${esc(a.why)}</small></div></div>`).join("")}</div>
        <details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:.8rem">Other reasonable orders you didn't pick</summary>${R.nasty.good.filter(g => !g.got).map(g => `<div style="font-size:.8rem;padding:2px 0"><b>${esc(g.label)}</b> — ${esc(g.why)}</div>`).join("") || "<span class='muted'>none</span>"}</details></div>
      <div class="card"><h3>Exam choices</h3><p class="muted" style="font-size:.8rem;margin:4px 0 8px">Required = what this story demanded. Partial = you started it but skipped landmarks (e.g. no lung bases, no foot pulses).</p><div class="checklist">${R.exams.items.map(examRow).join("")}</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Encounter checklist</h3><div class="checklist" style="margin-top:8px">${R.enc.items.map(i => `<div class="ck ${i.pts >= i.max ? "ok" : i.pts > 0 ? "part" : "miss"}"><span class="m">${i.pts}/${i.max}</span><div>${esc(i.label)}${i.detail && i.pts < i.max ? `<small>${esc(i.detail)}</small>` : ""}</div></div>`).join("")}</div></div>
      <div class="card"><h3>SOAP note vs. the rubric</h3><div class="rubric" style="margin-top:8px">${R.soap.items.map(i => `<div class="rb ${i.pts >= i.max ? "full" : i.pts > 0 ? "part" : "none"}"><div>${esc(i.label)}${i.detail && i.pts < i.max ? `<small>${esc(i.detail)}</small>` : ""}</div><div class="pts">${i.pts}/${i.max}</div></div>`).join("")}</div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" id="btnClaudeGrade" ${sampleFn ? "" : "disabled"}>Grade my note with Claude (clarity, terminology, rubric)</button><span class="muted" style="font-size:.75rem">${sampleFn ? "Uses your Claude usage; one call." : "Claude isn't available in this view."}</span></div><div id="claudeGrade" style="margin-top:8px"></div></div>
    </div>
    <div class="card"><details class="reveal"><summary>Model SOAP note for this patient</summary><div class="scriptblock" style="margin-top:8px">SUBJECTIVE:\n${esc(c.modelNote.S)}\n\nOBJECTIVE:\n${esc(c.modelNote.O)}\n\nASSESSMENT:\n${esc(c.modelNote.A)}\n\nPLAN:\n${esc(c.modelNote.P)}</div></details>
      <details class="reveal" style="margin-top:8px"><summary>Your note</summary><div class="scriptblock" style="margin-top:8px">${esc(noteText())}</div></details>
      <details class="reveal" style="margin-top:8px"><summary>The full SP script (everything you could have uncovered)</summary><div class="scriptblock" style="margin-top:8px">${esc(Object.entries(c.a).map(([k, v]) => k + ": " + v).join("\n"))}\n\n— EXAM —\n${esc(Object.entries(c.exam).map(([k, v]) => k + ": " + (typeof v === "string" ? v : JSON.stringify(v))).join("\n"))}</div></details>
      <details class="reveal" style="margin-top:8px"><summary>What you asked, in order</summary><div class="scriptblock" style="margin-top:8px">${esc(S.askedOrder.map(a => a.i).join(" → ")) || "nothing"}</div></details></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="dbHall">Back to the hallway</button><button class="btn" id="dbRetry">Retry this room</button></div>
  </div>`;
  $("#dbHall").onclick = renderHallway; $("#dbRetry").onclick = () => startEncounter(c);
  $("#btnClaudeGrade").onclick = async () => { const out = $("#claudeGrade"); const b = $("#btnClaudeGrade"); b.disabled = true; out.innerHTML = '<span class="muted">Thinking…</span>'; try { const res = await claudeGrade(c); out.innerHTML = `<div class="rubric">${(res.items || []).map(i => `<div class="rb ${i.score >= i.max ? "full" : i.score > 0 ? "part" : "none"}"><div>${esc(i.item)}<small>${esc(i.feedback)}</small></div><div class="pts">${esc(String(i.score))}/${esc(String(i.max))}</div></div>`).join("")}</div>${res.overall ? `<p style="font-size:.85rem">${esc(res.overall)}</p>` : ""}`; } catch (e) { out.innerHTML = `<span class="muted">Couldn't grade (${esc(e && e.code || "error")}).</span>`; b.disabled = false; } };
}
async function claudeGrade(c) {
  const rubric = `DCOM EPC SPE SOAP rubric items (score each 0–2 unless noted):
1 Chief complaint: complete and in a separate section. 2 HPI identifies patient by age and gender. 3 HPI components (location/radiation, quality, severity, duration, timing, context/prior episodes, modifying factors, progression): 5+ =2, 2–4 =1. 4 PMH (conditions incl. what meds are for, hospitalizations, surgeries, injuries): 3+ =2. 5 Medications (Rx, dosing, OTC, vitamins/herbs): 3+ =2. 6 Allergies (med, food, environmental, WITH reactions): 3+ with reactions =2. 7 Social (tobacco, alcohol, drugs, occupation): 3+ =2. 8 Family (mother, father, siblings/children): 3+ =2. 9 ROS (0–4): primary system + 3 other related systems =4, +2 =3, +1 =2, primary only =1. 10 Physical exam (0–3): vitals from door note, general statement, pertinent exam for this complaint documented in standard form (e.g. "Normal rate, reg rhythm, no MRG; PMI nondisplaced; no carotid bruits; pulses +2 symmetric; no pedal edema" / "Respirations unlabored, chest wall expansion symmetrical without rib dysfunction, LCTAB"). 11 Clarity/readability (grammar, word choice, spelling). 12 Medical terminology and only appropriate abbreviations. 13 Formatting: only subjective data in S, only objective in O; no patient name or DOB (age/gender only). 14 Assessment/Plan (0–3): working diagnosis named, must-do plan items present, patient understanding documented.`;
  const prompt = `You are grading a first-year medical student's SOAP note from a standardized-patient encounter. Be specific and constructive; point to exact phrases. Do not invent facts.
${rubric}
CASE FACTS (what the SP would have revealed): ${c.age} yo ${c.sex}. Door vitals BP ${c.door.bp} HR ${c.door.hr} RR ${c.door.rr} T ${c.door.temp} SpO2 ${c.door.spo2}. Working diagnosis: ${c.nasty.label}. Must-do plan: ${c.orders.must.map(o => ORDERS.find(x => x.id === o.id)?.label).join("; ")}.
MODEL NOTE for comparison:\n${c.modelNote.S}\n${c.modelNote.O}\nA: ${c.modelNote.A}\nP: ${c.modelNote.P}
STUDENT NOTE:\n${noteText().slice(0, 12000)}
Reply with ONLY JSON: {"items":[{"item":"<rubric item name>","score":<number>,"max":<number>,"feedback":"<1–2 sentences>"}...14 items],"overall":"<3 sentences: the single biggest fix, then two strengths>"}`;
  return await sampleFn.json(prompt, { modelTier: "default" });
}

// ===================== BOOT =====================
function updateStartStatus() {
  const el = $("#startStatus"); if (!el) return;
  if (!claudeChecked) { el.innerHTML = '<span class="pill neutral">Checking whether Claude is available…</span>'; return; }
  el.innerHTML = sampleFn ? '<span class="pill ok">Claude detected — all features available</span> <span class="muted" style="font-size:.78rem">Claude will ask your permission the first time the patient needs it; those calls use your own Claude usage.</span>'
    : '<span class="pill warn">Claude not available — script-only mode</span> <span class="muted" style="font-size:.78rem">Everything in the green box works. Sign in to claude.ai and reopen the link to enable the teal box.</span>';
}
function showStartScreen() {
  overlay(`<div class="eyebrow">Student Doctor · Clinical Skills</div><h2 style="margin:4px 0 2px">SPE Simulator</h2>
  <p class="muted" style="margin:0 0 10px;font-size:.9rem">Eight exam rooms, timed encounters, a hallway SOAP note, and rubric grading. Here's what needs a Claude sign-in and what doesn't.</p>
  <div id="startStatus" style="margin-bottom:10px"></div>
  <div class="grid2" style="gap:10px">
    <div class="card" style="border-color:var(--ok)"><div class="eyebrow" style="color:var(--ok)">No sign-in needed</div><ul style="margin:6px 0 0;padding-left:18px;font-size:.84rem;line-height:1.5">
      <li>All 8 patients and their full scripts</li><li>Typing questions to the patient (the script understands ~90 question types)</li><li>The patient's spoken voice (your browser's own voice)</li><li>Speaking instead of typing: on the claude.ai link use your device's dictation into the message box; on the hosted (GitHub Pages) link there is a 🎤 button that listens hands-free</li><li>Works on phone, tablet and computer</li><li>Every exam mini-game: heart, lungs, chest wall, pulses, edema, cap refill, skin, neck, OSE</li><li>Hand-hygiene, gown and timer tracking</li><li>A&amp;P orders, discussing the plan, teach-back</li><li>The 12-minute SOAP note and the automatic rubric grade, evidence chain and model note</li></ul></div>
    <div class="card" style="border-color:var(--accent)"><div class="eyebrow" style="color:var(--accent)">Needs a signed-in Claude account</div><ul style="margin:6px 0 0;padding-left:18px;font-size:.84rem;line-height:1.5">
      <li>The patient improvising an answer when you ask something the script doesn't recognize (without Claude the patient just asks you to rephrase)</li><li>"Grade my note with Claude" in the debrief — extra feedback on clarity, terminology and formatting</li></ul>
      <p class="muted" style="font-size:.75rem;margin:8px 0 0">Both are optional, ask permission once, and use the viewer's own Claude usage. Set "Patient brain" to Script only in the hallway settings to never use them.</p></div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" id="startGo">Enter the clinic</button></div>`);
  updateStartStatus();
  $("#startGo").onclick = closeOverlay;
}
function start() { renderHallway(); showStartScreen(); }
try { if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => ({ settings })); } catch { }
window.claude?.hot?.ready ? window.claude.hot.ready(() => start()) : start();
</script>
